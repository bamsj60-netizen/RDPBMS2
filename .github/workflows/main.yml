name: Windows-Gaming-Bore-Super-Final

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 🚀 1. Persiapan Performa
        run: |
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Set-MpPreference -DisableRealtimeMonitoring $true
          Write-Host "Sistem Siap!"

      - name: 🖥️ 2. Setup Virtual Display
        run: |
          $url = "https://github.com/ge9/IddSampleDriver/releases/download/0.0.1.2/IddSampleDriver.zip"
          Invoke-WebRequest -Uri $url -OutFile display.zip
          Expand-Archive display.zip -DestinationPath C:\DisplayDriver -Force
          Write-Host "Driver Display siap di C:\DisplayDriver"

      - name: 🎮 3. Setup Mesa3D (GPU Emulator)
        run: |
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile 7zr.exe
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/23.3.5/mesa3d-23.3.5-release-msvc.7z"
          Invoke-WebRequest -Uri $mesaUrl -OutFile mesa.7z
          ./7zr.exe x mesa.7z -oC:\Mesa3D -y
          Write-Host "Mesa3D siap di C:\Mesa3D"

      - name: 📱 4. Install Parsec
        run: |
          Invoke-WebRequest -Uri "https://builds.parsec.app/package/parsec-windows.exe" -OutFile parsec.exe
          Start-Process ./parsec.exe -ArgumentList "/silent" -Wait

      - name: 🔑 5. Konfigurasi User RDP (Fix Error 1378)
        run: |
          # Mengaktifkan RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Set password untuk user yang sudah ada (runneradmin adalah user default Github)
          net user BMSSTORE BMSSTORE123
          
          # Cek dulu apakah sudah admin, kalau belum baru ditambah (mencegah error 1378)
          $group = "Administrators"
          $user = "BMSSTORE"
          if ((Get-LocalGroupMember -Group $group).Name -notcontains $user) {
              Add-LocalGroupMember -Group $group -Member $user -ErrorAction SilentlyContinue
          }
          Write-Host "User: BMSSTORE | Pass: BMSSTORE123"

      - name: 🔗 6. Launch Bore Tunnel & Show Address
        shell: powershell
        run: |
          # Download Bore Tunnel
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath . -Force
          
          Write-Host "--- SEDANG MENCARI ALAMAT TUNNEL ---"
          
          # Menjalankan Bore dan menyimpan outputnya ke file log sementara
          Start-Process -FilePath "./bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore_log.txt"
          
          # Tunggu 5 detik agar Bore selesai negosiasi alamat dengan server
          Start-Sleep -Seconds 5
          
          # Tampilkan isi log agar kamu bisa lihat alamat bore.pub:PORT
          Get-Content bore_log.txt
          
          Write-Host "=========================================="
          Write-Host "LIHAT ALAMAT DI ATAS (bore.pub:XXXXX)"
          Write-Host "=========================================="
          
          # Loop agar Github tidak mati
          for ($i=1; $i -le 360; $i++) {
            if ($i -eq 5) { Get-Content bore_log.txt } # Tampilkan ulang log tiap beberapa menit buat jaga-jaga
            Start-Sleep -Seconds 60
          }
