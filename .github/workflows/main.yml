name: Windows-Gaming-Bore-Extreme-Fixed

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 🚀 1. Extreme Performance Tweak
        run: |
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Set-MpPreference -DisableRealtimeMonitoring $true
          Write-Host "Performa Maksimal diaktifkan!"

      - name: 🖥️ 2. Install Virtual Display (Link Baru)
        run: |
          # Menggunakan link alternatif yang lebih stabil
          $url = "https://github.com/ge9/IddSampleDriver/releases/download/0.0.1.2/IddSampleDriver.zip"
          Invoke-WebRequest -Uri $url -OutFile display.zip
          Expand-Archive display.zip -DestinationPath C:\DisplayDriver
          Write-Host "Virtual Display Driver Berhasil Diunduh."

      - name: 🎮 3. Download Gaming Tools (Parsec & Mesa3D)
        run: |
          # Parsec Installer
          Invoke-WebRequest -Uri "https://builds.parsec.app/package/parsec-windows.exe" -OutFile parsec.exe
          Start-Process ./parsec.exe -ArgumentList "/silent" -Wait
          
          # Mesa3D (GPU Emulator) - Menggunakan Link Direct ke versi stabil
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/23.3.5/mesa3d-23.3.5-release-msvc.7z"
          Invoke-WebRequest -Uri $mesaUrl -OutFile C:\mesa.7z
          Write-Host "Mesa3D siap di C:\mesa.7z"

      - name: 🔑 4. Setup User & RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          net user runneradmin Password123!
          net localgroup administrators runneradmin /add
          Write-Host "RDP Siap. User: runneradmin | Pass: Password123!"

      - name: 🔗 5. Launch Bore & Anti-Close
        shell: powershell
        run: |
          # Download Bore Tunnel
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath .
          
          Write-Host "=== HUBUNGKAN KE ALAMAT DI BAWAH ==="
          # Menjalankan tunnel di background
          Start-Process ./bore.exe -ArgumentList "local 3389 --to bore.pub"
          
          # Keep Alive agar tidak mati 6 jam
          for ($i=1; $i -le 360; $i++) {
            Write-Host "RDP Aktif - Menit ke: $i"
            Start-Sleep -Seconds 60
          }
